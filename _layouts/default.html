<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% if page.title and page.layout != 'home' %}{{ page.title | escape }} | {% endif %}{{ site.title }}</title>
<meta name="description" content="{{ page.excerpt | default: site.description | strip_html | strip_newlines | truncate: 150 | escape }}">
<meta name="theme-color" content="#060A1C">
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap">
<link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}">
</head>
<body class="{{ page.layout }}">
<div class="progress" aria-hidden="true"></div>
<header class="top">
  <a class="brand" href="{{ '/' | relative_url }}"><span class="brand-mark" aria-hidden="true"></span>JH-INVESTING</a>
  <nav>
    <a href="{{ '/' | relative_url }}#archive">리포트</a>
    <a href="{{ '/about/' | relative_url }}">소개</a>
  </nav>
</header>
{{ content }}
<footer class="foot">
  <p>리포트는 AI(Claude)가 매일 아침 새로 검색한 공개 정보를 바탕으로 작성합니다. 투자 권유가 아니며, 투자 판단과 그 결과에 대한 책임은 투자자 본인에게 있습니다.</p>
  <p class="foot-small">© {{ site.time | date: '%Y' }} JH-INVESTING</p>
</footer>
<script src="{{ '/assets/js/site.js' | relative_url }}" defer></script>
</body>
</html>
