# 용어집: 리포트 본문에서 자동으로 밑줄이 생기고, 누르면 설명이 뜹니다.
# term: 본문에 나오는 표기 / aliases: 같은 뜻의 다른 표기 / desc: 1~2문장 쉬운 설명
- term: CPI
  aliases: [소비자물가지수]
  desc: 소비자물가지수. 사람들이 사는 물건과 서비스 가격이 얼마나 올랐는지 보여주는 대표적인 물가 지표입니다. 예상보다 높으면 금리 인상 걱정이 커집니다.
- term: 근원 CPI
  aliases: [근원물가, 근원 물가]
  desc: 가격이 들쭉날쭉한 식료품과 에너지를 뺀 물가입니다. 물가의 기본 흐름을 보여줘서 중앙은행이 더 중요하게 봅니다.
- term: PPI
  aliases: [생산자물가지수]
  desc: 생산자물가지수. 기업이 물건을 만들어 팔 때 받는 가격의 변화입니다. 시간이 지나 소비자물가로 이어지는 경우가 많아 선행 지표로 봅니다.
- term: PCE
  desc: 개인소비지출 물가지수. 미국 연준이 물가 목표(2%)를 판단할 때 기준으로 삼는 지표입니다.
- term: FOMC
  desc: 미국 연준에서 기준금리를 결정하는 회의입니다. 1년에 8번 열립니다.
- term: 연준
  aliases: [Fed, 연방준비제도]
  desc: 미국의 중앙은행(연방준비제도)입니다. 기준금리를 올리고 내려 물가와 고용을 조절합니다.
- term: FedWatch
  desc: 시카고상품거래소(CME)가 금리 선물 가격으로 계산해 보여주는 '다음 회의 금리 결정 확률'입니다. 시장이 무엇을 예상하는지 볼 때 씁니다.
- term: bp
  aliases: [베이시스포인트]
  desc: 금리 변화를 재는 단위로 1bp는 0.01%p입니다. 25bp 인상은 금리를 0.25%p 올린다는 뜻입니다.
- term: 빅스텝
  desc: 기준금리를 한 번에 0.5%p 올리거나 내리는 것입니다. 보통은 0.25%p씩 움직입니다.
- term: 국채 2년물
  aliases: [2년물]
  desc: 만기가 2년인 미국 국채입니다. 연준의 기준금리 전망에 가장 민감하게 움직입니다.
- term: 국채 10년물
  aliases: [10년물]
  desc: 만기가 10년인 미국 국채입니다. 전 세계 대출 금리와 주식 가치 평가의 기준이 되는 대표 금리입니다.
- term: 장단기 금리차
  desc: 장기 금리(10년물)에서 단기 금리(2년물)를 뺀 값입니다. 좁아지거나 뒤집히면 경기 둔화 신호로 해석하기도 합니다.
- term: 달러인덱스
  aliases: [DXY]
  desc: 유로, 엔 등 주요 6개 통화와 비교한 달러의 가치입니다. 오르면 달러가 강하다는 뜻이고, 보통 신흥국 증시에는 부담이 됩니다.
- term: WTI
  desc: 미국 서부텍사스산 원유. 미국 유가의 기준입니다.
- term: 브렌트유
  desc: 북해산 원유. 국제 유가의 기준으로 가장 널리 쓰입니다.
- term: S&P 500
  desc: 미국 대표 대기업 500개로 만든 주가지수입니다. 미국 증시 전체 흐름을 볼 때 기준으로 씁니다.
- term: 나스닥
  desc: 기술주 비중이 높은 미국 주가지수입니다. 금리와 AI·반도체 뉴스에 민감합니다.
- term: 다우존스
  aliases: [다우]
  desc: 미국의 전통 우량 기업 30개로 만든 주가지수입니다.
- term: 러셀 2000
  desc: 미국 중소형주 2,000개로 만든 지수입니다. 미국 내수 경기와 금리 부담을 잘 반영합니다.
- term: 필라델피아 반도체지수
  aliases: [SOX]
  desc: 미국에 상장된 주요 반도체 기업 30개로 만든 지수입니다. 삼성전자·SK하이닉스 주가와 같은 방향으로 움직이는 경우가 많습니다.
- term: 동일가중
  desc: 회사 크기와 상관없이 모든 종목을 같은 비중으로 계산하는 방식입니다. 대형주 몇 개가 지수를 왜곡하는지 확인할 때 봅니다.
- term: 시가총액
  aliases: [시총]
  desc: 주가에 발행 주식 수를 곱한 값, 즉 회사 전체의 시장 가격입니다.
- term: 시간외
  desc: 정규장이 끝난 뒤나 열리기 전에 이뤄지는 거래입니다. 장 마감 후 나온 실적에 대한 첫 반응이 여기서 나타납니다.
- term: 가이던스
  desc: 회사가 직접 밝히는 앞으로의 실적 전망입니다. 지난 실적보다 가이던스에 주가가 더 크게 반응하는 경우가 많습니다.
- term: HBM
  desc: 고대역폭메모리. D램을 여러 층으로 쌓아 속도를 높인 메모리로, AI 반도체(GPU) 옆에 꼭 들어갑니다. SK하이닉스와 삼성전자의 핵심 제품입니다.
- term: 소부장
  desc: 소재·부품·장비의 줄임말입니다. 반도체 소부장은 반도체를 만드는 데 필요한 재료와 장비를 공급하는 회사들을 말합니다.
- term: 순매수
  desc: 산 금액이 판 금액보다 많은 상태입니다. '외국인 순매수'는 외국인이 판 것보다 더 많이 샀다는 뜻입니다.
- term: 순매도
  desc: 판 금액이 산 금액보다 많은 상태입니다.
- term: 수급
  desc: 누가 사고 누가 팔았는지를 말합니다. 한국 증시에서는 외국인·기관·개인으로 나눠 봅니다.
- term: 사이드카
  desc: 선물 가격이 급등락할 때 프로그램 매매를 5분간 멈추는 장치입니다. 시장이 그만큼 크게 움직였다는 신호입니다.
- term: 서킷브레이커
  desc: 지수가 크게 떨어지면 시장 전체 거래를 잠시 멈추는 장치입니다. 사이드카보다 강한 조치입니다.
- term: 옵션 만기
  aliases: [옵션 만기일]
  desc: 옵션 계약이 끝나는 날입니다(한국은 매달 둘째 목요일). 이날은 관련 매매가 몰려 장 막판 변동이 커질 수 있습니다.
- term: 디커플링
  desc: 평소 같이 움직이던 것들이 따로 움직이는 현상입니다.
- term: 네고
  desc: 수출 기업이 벌어온 달러를 원화로 바꾸려고 파는 것입니다. 네고 물량이 많으면 환율이 내려갑니다.
- term: 순이자마진
  desc: 은행이 대출로 받는 이자와 예금에 주는 이자의 차이에서 나오는 수익률입니다. 금리가 오르면 대체로 좋아집니다.
- term: IPO
  aliases: [기업공개]
  desc: 회사가 처음으로 주식을 증시에 상장해 누구나 살 수 있게 하는 것입니다.
- term: 블루 웨이브
  desc: 미국 선거에서 민주당(상징색 파랑)이 의회를 휩쓰는 결과를 말합니다.
- term: 매파
  aliases: [매파적]
  desc: 물가를 잡기 위해 금리를 올리자는 쪽입니다. 반대는 비둘기파입니다.
- term: 비둘기파
  aliases: [비둘기파적]
  desc: 경기를 살리기 위해 금리를 낮추자는 쪽입니다. 반대는 매파입니다.
- term: 밸류에이션
  desc: 회사의 이익이나 자산에 비해 주가가 비싼지 싼지를 따지는 것입니다.
- term: ADR
  aliases: [미국예탁증서]
  desc: 미국예탁증서. 외국 기업 주식을 미국 증시에서 거래할 수 있게 만든 증서입니다. 한국 기업 ADR의 밤사이 움직임은 다음 날 국내 주가의 힌트가 됩니다.
- term: VIX
  aliases: [공포지수]
  desc: S&P 500 옵션 가격으로 계산한 '앞으로 30일 동안 예상되는 변동성' 지표입니다. 숫자가 높을수록 투자자들이 불안해한다는 뜻이라 '공포지수'라고도 부릅니다.
- term: 야간선물
  desc: 한국 정규장이 끝난 뒤 저녁부터 다음 날 새벽까지 거래되는 코스피200 선물입니다. 미국장 흐름이 반영돼 다음 날 아침 한국장 출발을 가늠하는 데 쓰입니다.
- term: EWY
  desc: 미국 증시에 상장된 한국 주식 ETF(MSCI 한국 지수 추종)입니다. 한국장이 닫힌 밤사이 외국인이 한국 주식을 어떻게 보는지 보여주는 참고 지표로 쓰입니다.
- term: 신규 실업수당 청구건수
  desc: 미국에서 한 주 동안 새로 실업급여를 신청한 사람 수입니다. 매주 목요일 발표되며, 숫자가 늘면 고용시장이 식고 있다는 신호로 읽힙니다.
- term: 기존주택판매
  desc: 새로 지은 집이 아닌, 이미 있던 주택이 한 달 동안 얼마나 거래됐는지 보여주는 미국 지표입니다. 금리가 오르면 대출 부담 때문에 보통 줄어듭니다.
- term: 목표주가
  desc: 증권사 애널리스트가 분석을 바탕으로 '앞으로 이 정도 가격이 적정하다'고 제시하는 주가입니다. 전망일 뿐 실제 주가를 보장하지 않습니다.
- term: 지배구조
  desc: 회사를 누가, 어떤 방식으로 이끌고 감시하는지를 말합니다. CEO와 이사회의 관계, 의사결정 구조 등이 포함되며, 문제가 생기면 주가에 큰 영향을 줄 수 있습니다.
- term: 현물가격
  desc: 그때그때 시장에서 바로 사고팔 때 매겨지는 가격입니다. 메모리 반도체에서는 수요 변화를 빨리 보여줘서, 앞으로 고정거래가격이 어떻게 움직일지 가늠하는 신호로 봅니다.
- term: 고정거래가격
  desc: 메모리 업체가 PC·서버 회사 같은 큰 고객과 보통 분기나 월 단위로 계약해 정하는 가격입니다. 메모리 회사 실적에 직접 영향을 줍니다.
- term: 증시안정펀드
  desc: 주가가 크게 떨어질 때 시장을 진정시키려고 금융기관들이 돈을 모아 주식을 사들이는 펀드입니다. 줄여서 '증안펀드'라고도 합니다.
